<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091e42" flood-opacity=".16"/></filter>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8e44ad"/></marker>
    <style>
      text{font-family:Arial,"Helvetica Neue",sans-serif;fill:#172b4d}.header{font-size:15px;font-weight:700;letter-spacing:.4px}.service{font-size:14px;font-weight:700;text-anchor:middle}.sub{font-size:11px;fill:#5e6c84;text-anchor:middle}.small{font-size:11px;fill:#42526e}.tiny{font-size:10px;fill:#5e6c84}.card{fill:#fff;stroke:#dfe1e6;stroke-width:1.5;rx:11;filter:url(#shadow)}.flow{fill:none;stroke:#8e44ad;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#purple)}.benefit{fill:#dfe1e6}.benefitHead{fill:#fff}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>
  <text x="44" y="50" font-size="30" font-weight="700">Analytics Pipeline</text>
  <text x="44" y="78" font-size="14" fill="#5e6c84">Non-blocking analytics copy of operational integration events</text>

  <!-- Section frames -->
  <rect x="35" y="110" width="350" height="700" rx="14" fill="#f7f9fc" stroke="#0052cc" stroke-width="1.5"/>
  <rect x="35" y="110" width="350" height="42" rx="14" fill="#b3d4ff"/><text x="55" y="137" class="header">OPERATIONAL EVENTS</text>
  <rect x="410" y="110" width="720" height="700" rx="14" fill="#f7f9fc" stroke="#0052cc" stroke-width="1.5"/>
  <rect x="410" y="110" width="720" height="42" rx="14" fill="#b3d4ff"/><text x="430" y="137" class="header">INGESTION AND DATA LAKE</text>
  <rect x="1155" y="110" width="360" height="700" rx="14" fill="#f7f9fc" stroke="#0052cc" stroke-width="1.5"/>
  <rect x="1155" y="110" width="360" height="42" rx="14" fill="#b3d4ff"/><text x="1175" y="137" class="header">DATA CATALOG AND QUERY</text>
  <rect x="1540" y="110" width="345" height="700" rx="14" fill="#f7f9fc" stroke="#0052cc" stroke-width="1.5"/>
  <rect x="1540" y="110" width="345" height="42" rx="14" fill="#b3d4ff"/><text x="1560" y="137" class="header">BUSINESS INTELLIGENCE</text>

  <!-- EventBridge -->
  <g transform="translate(80 195)"><rect width="260" height="225" rx="13" fill="#fff" stroke="#8e44ad" stroke-width="2.5" filter="url(#shadow)"/><image href="assets/aws/eventbridge.svg" x="90" y="18" width="80" height="80"/><text x="130" y="125" class="service" font-size="17">EventBridge</text><text x="130" y="147" class="sub" font-size="13">Integration Event Bus</text><line x1="35" y1="166" x2="225" y2="166" stroke="#dfe1e6"/><text x="48" y="190" class="small">• Shipment Requests</text><text x="48" y="210" class="small">• Processing Responses</text></g>
  <text x="128" y="438" class="small">• Status Updates</text>
  <g transform="translate(80 500)"><rect class="card" width="260" height="150"/><image href="assets/aws/eventbridge.svg" x="24" y="28" width="58" height="58"/><text x="170" y="52" class="service">Analytics Rule</text><text x="170" y="78" class="sub">Copies all integration events</text><text x="130" y="116" class="tiny">Matches the transactional event stream</text><text x="130" y="134" class="tiny">without changing its destinations</text></g>
  <path d="M210 420V500" class="flow"/>

  <!-- Firehose -->
  <g transform="translate(450 265)"><rect class="card" width="250" height="260"/><image href="assets/aws/firehose.svg" x="85" y="18" width="80" height="80"/><text x="125" y="125" class="service">Amazon Kinesis Data Firehose</text><line x1="35" y1="145" x2="215" y2="145" stroke="#dfe1e6"/><text x="60" y="174" class="small">• Buffer</text><text x="60" y="198" class="small">• JSON → Parquet</text><text x="60" y="222" class="small">• Compression</text><text x="60" y="246" class="small">• Batch Delivery</text></g>
  <path d="M340 575H420V395H450" class="flow"/><text x="405" y="559" class="tiny" text-anchor="end">Analytics copy</text>

  <!-- S3 -->
  <g transform="translate(765 195)"><rect width="320" height="480" rx="13" fill="#fff" stroke="#00875a" stroke-width="2.5" filter="url(#shadow)"/><image href="assets/aws/s3.svg" x="120" y="20" width="80" height="80"/><text x="160" y="126" class="service" font-size="17">Amazon S3</text><text x="160" y="150" class="sub" font-size="13">Integration Data Lake</text><line x1="45" y1="173" x2="275" y2="173" stroke="#dfe1e6"/><rect x="45" y="198" width="230" height="160" rx="9" fill="#f4f5f7" stroke="#c1c7d0"/><text x="68" y="230" font-size="12" font-family="monospace">integration-events/</text><text x="88" y="260" font-size="12" font-family="monospace">year=YYYY/</text><text x="108" y="290" font-size="12" font-family="monospace">month=MM/</text><text x="128" y="320" font-size="12" font-family="monospace">day=DD/</text><text x="65" y="397" class="small">firehose-errors/</text><text x="65" y="429" class="small">athena-results/</text><text x="160" y="461" class="sub">Partitioned, compressed Parquet</text></g>
  <path d="M700 395H765" class="flow"/>

  <!-- Glue and Athena -->
  <g transform="translate(1195 205)"><rect class="card" width="280" height="245"/><image href="assets/aws/glue.svg" x="100" y="17" width="80" height="80"/><text x="140" y="124" class="service" font-size="16">AWS Glue Data Catalog</text><line x1="45" y1="145" x2="235" y2="145" stroke="#dfe1e6"/><text x="65" y="176" class="small">• Schema Discovery</text><text x="65" y="203" class="small">• Metadata</text><text x="65" y="230" class="small">• Partition Projection</text></g>
  <g transform="translate(1195 520)"><rect class="card" width="280" height="205"/><image href="assets/aws/athena.svg" x="100" y="15" width="80" height="80"/><text x="140" y="122" class="service" font-size="16">Amazon Athena</text><text x="140" y="148" class="sub">SQL Queries</text><text x="140" y="171" class="sub">Ad-hoc Analysis</text></g>
  <path d="M1085 335H1195" class="flow"/><text x="1140" y="320" class="tiny" text-anchor="middle">Catalog data</text>
  <path d="M1335 450V520" class="flow"/>

  <!-- QuickSight -->
  <g transform="translate(1580 195)"><rect width="265" height="530" rx="13" fill="#fff" stroke="#6554c0" stroke-width="2.5" filter="url(#shadow)"/><circle cx="133" cy="63" r="48" fill="#eae6ff"/><path d="M103 84V59m20 25V42m20 42V52m20 32V30" stroke="#6554c0" stroke-width="8"/><text x="133" y="145" class="service" font-size="18">Amazon QuickSight</text><text x="133" y="172" class="sub" font-size="14">Operational Dashboards</text><line x1="40" y1="196" x2="225" y2="196" stroke="#dfe1e6"/><rect x="40" y="220" width="185" height="250" rx="9" fill="#f6f3ff" stroke="#c0b6f2"/><text x="65" y="257" class="small">• Request Volume</text><text x="65" y="295" class="small">• Processing Outcomes</text><text x="65" y="333" class="small">• Delivery Success Rate</text><text x="65" y="371" class="small">• Delivery Failures</text><text x="65" y="409" class="small">• Partner Activity</text><text x="65" y="447" class="small">• Daily Trends</text><text x="133" y="500" class="sub">Business-ready insights</text></g>
  <path d="M1475 622H1545V460H1580" class="flow"/>

  <!-- Transactional fan-out note -->
  <g transform="translate(450 620)"><rect width="250" height="115" rx="11" fill="#deebff" stroke="#0052cc"/><text x="125" y="28" class="service">Transactional Path</text><path d="M125 38V61" stroke="#0052cc" stroke-width="2" marker-end="url(#purple)"/><text x="125" y="82" class="service">Analytics Copy</text><text x="125" y="103" class="tiny">EventBridge fan-out does not affect operational workloads.</text></g>

  <!-- Characteristics -->
  <rect x="35" y="845" width="1850" height="190" rx="14" fill="#232f3e"/>
  <text x="65" y="882" font-size="15" font-weight="700" class="benefitHead">ANALYTICS CHARACTERISTICS</text>
  <text x="65" y="923" font-size="12" class="benefit">• Operational processing remains independent.</text>
  <text x="65" y="959" font-size="12" class="benefit">• Analytics never blocks message processing.</text>
  <text x="65" y="995" font-size="12" class="benefit">• Events are stored in Parquet for efficient querying.</text>
  <text x="700" y="923" font-size="12" class="benefit">• Athena provides serverless SQL analysis.</text>
  <text x="700" y="959" font-size="12" class="benefit">• QuickSight delivers business dashboards.</text>
  <text x="700" y="995" font-size="12" class="benefit">• Historical events remain available for reporting.</text>
  <text x="1320" y="923" font-size="12" class="benefit">EventBridge fans out a copy of every event.</text>
  <text x="1320" y="959" font-size="12" class="benefit">Transactional and analytical workloads scale independently.</text>
  <text x="1875" y="1068" text-anchor="end" font-size="10" fill="#7a869a">AWS Architecture Icons • analytics pipeline view</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091e42" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8e44ad"/></marker>
    <style>
      text{font-family:Arial,"Helvetica Neue",sans-serif;fill:#172b4d}.header{font-size:15px;font-weight:700;letter-spacing:.4px}.service{font-size:14px;font-weight:700;text-anchor:middle}.sub{font-size:11px;fill:#5e6c84;text-anchor:middle}.tiny{font-size:10px;fill:#5e6c84;text-anchor:middle}.benefit{fill:#dfe1e6}.benefitHead{fill:#fff}.card{fill:#fff;stroke:#dfe1e6;stroke-width:1.5;rx:11;filter:url(#shadow)}.flow{fill:none;stroke:#8e44ad;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.rule{fill:#f6f3ff;stroke:#6554c0;stroke-width:2;rx:11;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>
  <text x="44" y="50" font-size="30" font-weight="700">EventBridge Event Routing</text>
  <text x="44" y="78" font-size="14" fill="#5e6c84">Central enterprise routing for canonical integration events</text>

  <!-- Section frames -->
  <rect x="35" y="110" width="365" height="720" rx="14" fill="#f7f9fc" stroke="#0052cc" stroke-width="1.5"/>
  <rect x="35" y="110" width="365" height="42" rx="14" fill="#b3d4ff"/><text x="55" y="137" class="header">EVENT PUBLISHERS</text>
  <rect x="425" y="110" width="430" height="720" rx="14" fill="#f7f9fc" stroke="#0052cc" stroke-width="1.5"/>
  <rect x="425" y="110" width="430" height="42" rx="14" fill="#b3d4ff"/><text x="445" y="137" class="header">ENTERPRISE EVENT ROUTER</text>
  <rect x="880" y="110" width="440" height="720" rx="14" fill="#f7f9fc" stroke="#0052cc" stroke-width="1.5"/>
  <rect x="880" y="110" width="440" height="42" rx="14" fill="#b3d4ff"/><text x="900" y="137" class="header">EVENTBRIDGE RULES</text>
  <rect x="1345" y="110" width="540" height="720" rx="14" fill="#f7f9fc" stroke="#0052cc" stroke-width="1.5"/>
  <rect x="1345" y="110" width="540" height="42" rx="14" fill="#b3d4ff"/><text x="1365" y="137" class="header">INDEPENDENT DESTINATIONS</text>

  <!-- Publishers -->
  <g transform="translate(70 185)"><rect class="card" width="295" height="165"/><image href="assets/aws/lambda.svg" x="116" y="14" width="64" height="64"/><text x="148" y="100" class="service">Bidirectional Adapter Lambda</text><text x="148" y="120" class="sub">Publishes canonical shipment events</text><text x="148" y="141" class="tiny">CreateShipment  •  UpdateShipmentStatus</text><text x="148" y="157" class="tiny">RetrieveShipment</text></g>
  <g transform="translate(70 390)"><rect class="card" width="295" height="165"/><image href="assets/aws/lambda.svg" x="116" y="14" width="64" height="64"/><text x="148" y="100" class="service">Worker Lambda</text><text x="148" y="120" class="sub">Publishes response events</text><text x="148" y="141" class="tiny">SUCCESS  •  VALIDATION_FAILED</text><text x="148" y="157" class="tiny">PROCESSING_FAILED</text></g>
  <g transform="translate(70 595)"><rect class="card" width="295" height="165"/><circle cx="148" cy="48" r="32" fill="#e3fcef"/><path d="M126 53c0-10 8-16 17-16 3-11 22-11 25 3 11 0 13 16 2 19h-35c-6 0-9-2-9-6z" fill="none" stroke="#00875a" stroke-width="3"/><text x="148" y="100" class="service">Existing AWS Workloads</text><text x="148" y="121" class="sub">Publish canonical internal events directly</text><text x="148" y="142" class="tiny">Bypass API Gateway and Adapter</text></g>

  <!-- Event bus -->
  <g transform="translate(475 205)"><rect width="330" height="270" rx="14" fill="#fff" stroke="#8e44ad" stroke-width="3" filter="url(#shadow)"/><image href="assets/aws/eventbridge.svg" x="117" y="24" width="96" height="96"/><text x="165" y="151" class="service" font-size="18">Amazon EventBridge</text><text x="165" y="174" class="service">Custom Event Bus</text><text x="165" y="198" class="sub" font-size="13">Enterprise Event Router</text><line x1="45" y1="218" x2="285" y2="218" stroke="#dfe1e6"/><text x="165" y="244" class="sub">Loose coupling  •  Content-based routing</text><text x="165" y="261" class="sub">Publish / Subscribe</text></g>
  <g transform="translate(475 515)"><rect class="card" width="330" height="245"/><text x="165" y="33" class="service">Canonical JSON Events</text><rect x="48" y="53" width="234" height="156" rx="8" fill="#f4f5f7" stroke="#c1c7d0"/><text x="72" y="80" font-size="12" font-family="monospace">eventType</text><text x="72" y="102" font-size="12" font-family="monospace">eventSource</text><text x="72" y="124" font-size="12" font-family="monospace">eventId</text><text x="72" y="146" font-size="12" font-family="monospace">correlationId</text><text x="72" y="168" font-size="12" font-family="monospace">timestamp</text><text x="72" y="190" font-size="12" font-family="monospace">payload</text></g>

  <!-- Rules -->
  <g transform="translate(920 190)"><rect class="rule" width="360" height="175"/><image href="assets/aws/eventbridge.svg" x="20" y="20" width="54" height="54"/><text x="220" y="43" class="service">Shipment Processing Rule</text><text x="220" y="67" class="sub">Matches</text><text x="180" y="98" class="tiny">ShipmentCreated</text><text x="180" y="119" class="tiny">ShipmentStatusUpdated</text><text x="180" y="140" class="tiny">ShipmentRetrieved</text><text x="180" y="162" class="sub">Routes to Shipment Processing SQS</text></g>
  <g transform="translate(920 405)"><rect class="rule" width="360" height="175"/><image href="assets/aws/eventbridge.svg" x="20" y="20" width="54" height="54"/><text x="220" y="43" class="service">Response Routing Rule</text><text x="220" y="67" class="sub">Matches</text><text x="180" y="98" class="tiny">SUCCESS</text><text x="180" y="119" class="tiny">VALIDATION_FAILED</text><text x="180" y="140" class="tiny">PROCESSING_FAILED</text><text x="180" y="162" class="sub">Routes to Response SQS</text></g>
  <g transform="translate(920 620)"><rect class="rule" width="360" height="140"/><image href="assets/aws/eventbridge.svg" x="20" y="20" width="54" height="54"/><text x="220" y="44" class="service">Analytics Rule</text><text x="180" y="79" class="sub">Matches all integration events</text><text x="180" y="110" class="sub">Routes to Kinesis Data Firehose</text></g>

  <!-- Destinations -->
  <g transform="translate(1390 220)"><rect class="card" width="190" height="115"/><image href="assets/aws/sqs.svg" x="63" y="12" width="64" height="64"/><text x="95" y="97" class="service">Shipment Processing SQS</text></g>
  <g transform="translate(1390 435)"><rect class="card" width="190" height="115"/><image href="assets/aws/sqs.svg" x="63" y="12" width="64" height="64"/><text x="95" y="97" class="service">Response SQS</text></g>
  <g transform="translate(1390 635)"><rect class="card" width="150" height="115"/><image href="assets/aws/firehose.svg" x="43" y="10" width="64" height="64"/><text x="75" y="94" class="service">Kinesis Data</text><text x="75" y="109" class="service">Firehose</text></g>
  <g transform="translate(1575 635)"><rect class="card" width="125" height="115"/><image href="assets/aws/s3.svg" x="31" y="10" width="64" height="64"/><text x="63" y="94" class="service">Amazon S3</text><text x="63" y="109" class="sub">Data Lake</text></g>
  <g transform="translate(1735 635)"><rect class="card" width="115" height="115"/><image href="assets/aws/glue.svg" x="26" y="10" width="64" height="64"/><text x="58" y="94" class="service">AWS Glue</text><text x="58" y="109" class="sub">Data Catalog</text></g>
  <g transform="translate(1575 775)"><rect class="card" width="125" height="105"/><image href="assets/aws/athena.svg" x="31" y="8" width="64" height="64"/><text x="63" y="92" class="service">Athena</text></g>
  <g transform="translate(1735 775)"><rect class="card" width="115" height="105"/><circle cx="58" cy="39" r="30" fill="#eae6ff"/><path d="M42 52V37m11 15V27m11 25V33m11 19V20" stroke="#6554c0" stroke-width="5"/><text x="58" y="92" class="service">QuickSight</text></g>

  <!-- Routing arrows -->
  <path d="M365 268H475" class="flow"/><path d="M365 473H430V340H475" class="flow"/><path d="M365 678H430V405H475" class="flow"/>
  <path d="M805 300H875V277H920" class="flow"/><path d="M805 340H875V492H920" class="flow"/><path d="M805 380H850V690H920" class="flow"/>
  <path d="M1280 277H1390" class="flow"/><path d="M1280 492H1390" class="flow"/><path d="M1280 690H1390" class="flow"/>
  <path d="M1540 692H1575" class="flow"/><path d="M1700 692H1735" class="flow"/><path d="M1793 750V765H1638V775" class="flow"/><path d="M1700 828H1735" class="flow"/>

  <!-- Benefits -->
  <rect x="35" y="920" width="1850" height="125" rx="14" fill="#232f3e"/>
  <text x="65" y="951" font-size="15" font-weight="700" class="benefitHead">KEY ARCHITECTURAL BENEFITS</text>
  <text x="65" y="981" font-size="12" class="benefit">• Producers never communicate directly with consumers.</text>
  <text x="65" y="1006" font-size="12" class="benefit">• Routing is based on event content rather than destination.</text>
  <text x="625" y="981" font-size="12" class="benefit">• New consumers can be added without changing publishers.</text>
  <text x="625" y="1006" font-size="12" class="benefit">• Operational and analytics workloads remain independent.</text>
  <text x="1260" y="981" font-size="12" class="benefit">• Supports loose coupling and future extensibility.</text>
  <text x="1875" y="1068" text-anchor="end" font-size="10" fill="#7a869a">AWS Architecture Icons • EventBridge routing view</text>
</svg>

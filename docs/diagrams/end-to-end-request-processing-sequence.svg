<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091e42" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0052cc"/></marker>
    <marker id="return" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b778c"/></marker>
    <style>
      text{font-family:Arial,"Helvetica Neue",sans-serif;fill:#172b4d}.participant{fill:#fff;stroke:#0052cc;stroke-width:2;rx:9;filter:url(#shadow)}.pname{font-size:12px;font-weight:700;text-anchor:middle}.lifeline{fill:none;stroke:#7a869a;stroke-width:1.5;stroke-dasharray:7 6}.message{fill:none;stroke:#0052cc;stroke-width:2.3;marker-end:url(#arrow)}.response{fill:none;stroke:#6b778c;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#return)}.msg{font-size:11px;fill:#172b4d;text-anchor:middle}.step{font-size:10px;font-weight:700;fill:#fff;text-anchor:middle}.activation{fill:#deebff;stroke:#0052cc;stroke-width:1.5}.note{fill:#fff7e6;stroke:#ff8b00;stroke-width:1.5;rx:8}.noteText{font-size:10.5px;fill:#42526e;text-anchor:middle}.phase{font-size:13px;font-weight:700;fill:#0052cc}.benefit{fill:#dfe1e6}.benefitHead{fill:#fff}
    </style>
  </defs>
  <rect width="2560" height="1440" fill="#fff"/>
  <rect x="0" y="0" width="2560" height="92" fill="#deebff"/>
  <text x="40" y="48" font-family="Arial" font-size="30" font-weight="700" fill="#172b4d">End-to-End Request Processing Sequence</text>
  <text x="40" y="75" font-family="Arial" font-size="14" fill="#5e6c84">Chronological runtime interaction from request receipt through asynchronous processing and partner response delivery</text>

  <!-- Phase bands -->
  <rect x="30" y="210" width="2175" height="310" rx="12" fill="#f7fbff" stroke="#b3d4ff"/><text x="50" y="235" class="phase">1 · REQUEST ACCEPTANCE AND CANONICAL PUBLICATION</text>
  <rect x="30" y="530" width="2175" height="300" rx="12" fill="#f9f7ff" stroke="#c0b6f2"/><text x="50" y="555" class="phase">2 · ASYNCHRONOUS BUSINESS PROCESSING</text>
  <rect x="30" y="840" width="2175" height="385" rx="12" fill="#f7fbff" stroke="#b3d4ff"/><text x="50" y="865" class="phase">3 · RESPONSE ROUTING AND OUTBOUND DELIVERY</text>

  <!-- Participants -->
  <g transform="translate(30 115)"><rect class="participant" width="140" height="70"/><text x="70" y="31" class="pname">External</text><text x="70" y="49" class="pname">Partner</text></g>
  <g transform="translate(195 115)"><rect class="participant" width="140" height="70"/><text x="70" y="31" class="pname">API Gateway</text></g>
  <g transform="translate(360 115)"><rect class="participant" width="140" height="70"/><text x="70" y="26" class="pname">Bidirectional</text><text x="70" y="44" class="pname">Adapter Lambda</text></g>
  <g transform="translate(525 115)"><rect class="participant" width="140" height="70"/><text x="70" y="26" class="pname">Integration</text><text x="70" y="44" class="pname">MessageState</text></g>
  <g transform="translate(690 115)"><rect class="participant" width="140" height="70"/><text x="70" y="31" class="pname">Amazon</text><text x="70" y="49" class="pname">EventBridge</text></g>
  <g transform="translate(855 115)"><rect class="participant" width="140" height="70"/><text x="70" y="26" class="pname">Shipment</text><text x="70" y="44" class="pname">Processing SQS</text></g>
  <g transform="translate(1020 115)"><rect class="participant" width="140" height="70"/><text x="70" y="31" class="pname">Worker Lambda</text></g>
  <g transform="translate(1185 115)"><rect class="participant" width="140" height="70"/><text x="70" y="26" class="pname">Response</text><text x="70" y="44" class="pname">EventBridge</text></g>
  <g transform="translate(1350 115)"><rect class="participant" width="140" height="70"/><text x="70" y="31" class="pname">Response SQS</text></g>
  <g transform="translate(1515 115)"><rect class="participant" width="140" height="70"/><text x="70" y="26" class="pname">Outbound Response</text><text x="70" y="44" class="pname">Lambda</text></g>
  <g transform="translate(1680 115)"><rect class="participant" width="140" height="70"/><text x="70" y="26" class="pname">Partner</text><text x="70" y="44" class="pname">Configuration</text></g>
  <g transform="translate(1845 115)"><rect class="participant" width="140" height="70"/><text x="70" y="31" class="pname">Secrets Manager</text></g>
  <g transform="translate(2010 115)"><rect class="participant" width="140" height="70"/><text x="70" y="26" class="pname">Partner HTTPS</text><text x="70" y="44" class="pname">Endpoint</text></g>

  <!-- Lifelines -->
  <path d="M100 185V1225M265 185V1225M430 185V1225M595 185V1225M760 185V1225M925 185V1225M1090 185V1225M1255 185V1225M1420 185V1225M1585 185V1225M1750 185V1225M1915 185V1225M2080 185V1225" class="lifeline"/>

  <!-- Activation bars -->
  <rect x="257" y="270" width="16" height="205" class="activation"/>
  <rect x="422" y="305" width="16" height="170" class="activation"/>
  <rect x="1082" y="600" width="16" height="185" class="activation"/>
  <rect x="1577" y="915" width="16" height="270" class="activation"/>
  <rect x="2072" y="1080" width="16" height="55" class="activation"/>

  <!-- Request acceptance -->
  <circle cx="100" cy="270" r="13" fill="#0052cc"/><text x="100" y="274" class="step">1</text>
  <line x1="113" y1="270" x2="257" y2="270" class="message"/><text x="185" y="254" class="msg">POST /shipments · JSON or XML</text>
  <circle cx="265" cy="310" r="13" fill="#0052cc"/><text x="265" y="314" class="step">2</text>
  <line x1="278" y1="310" x2="422" y2="310" class="message"/><text x="350" y="294" class="msg">Lambda Proxy Event</text>
  <circle cx="430" cy="350" r="13" fill="#ff8b00"/><text x="430" y="354" class="step">3</text>
  <rect x="455" y="330" width="250" height="76" class="note"/><text x="580" y="350" class="noteText">Validate request</text><text x="580" y="367" class="noteText">Transform XML / JSON · Create canonical event</text><text x="580" y="384" class="noteText">Generate correlationId</text>
  <circle cx="430" cy="425" r="13" fill="#0052cc"/><text x="430" y="429" class="step">4</text>
  <line x1="443" y1="425" x2="587" y2="425" class="message"/><text x="515" y="411" class="msg">Create lifecycle record</text><text x="515" y="443" class="msg">RECEIVED · NOT_STARTED</text>
  <circle cx="430" cy="470" r="13" fill="#0052cc"/><text x="430" y="474" class="step">5</text>
  <line x1="443" y1="470" x2="752" y2="470" class="message"/><text x="598" y="456" class="msg">Publish Canonical Event</text>
  <circle cx="430" cy="500" r="13" fill="#6b778c"/><text x="430" y="504" class="step">6</text>
  <line x1="422" y1="500" x2="273" y2="500" class="response"/><text x="347" y="487" class="msg">HTTP 202 Accepted · correlationId</text>
  <line x1="257" y1="515" x2="108" y2="515" class="response"/><text x="183" y="503" class="msg">202 Accepted</text>

  <!-- Processing -->
  <circle cx="760" cy="590" r="13" fill="#0052cc"/><text x="760" y="594" class="step">7</text>
  <line x1="773" y1="590" x2="917" y2="590" class="message"/><text x="845" y="575" class="msg">Route shipment event</text>
  <circle cx="925" cy="625" r="13" fill="#0052cc"/><text x="925" y="629" class="step">8</text>
  <line x1="938" y1="625" x2="1082" y2="625" class="message"/><text x="1010" y="610" class="msg">Deliver message</text>
  <circle cx="1090" cy="675" r="13" fill="#ff8b00"/><text x="1090" y="679" class="step">9</text>
  <rect x="1115" y="650" width="220" height="72" class="note"/><text x="1225" y="672" class="noteText">Validate</text><text x="1225" y="689" class="noteText">Representative processing</text><text x="1225" y="706" class="noteText">Update processingStatus</text>
  <circle cx="1090" cy="745" r="13" fill="#0052cc"/><text x="1090" y="749" class="step">10</text>
  <line x1="1082" y1="745" x2="603" y2="745" class="message"/><text x="842" y="728" class="msg">processingStatus = SUCCESS / VALIDATION_FAILED / PROCESSING_FAILED</text>
  <circle cx="1090" cy="785" r="13" fill="#0052cc"/><text x="1090" y="789" class="step">11</text>
  <line x1="1103" y1="785" x2="1247" y2="785" class="message"/><text x="1175" y="770" class="msg">Publish Response Event</text>

  <!-- Delivery -->
  <circle cx="1255" cy="900" r="13" fill="#0052cc"/><text x="1255" y="904" class="step">12</text>
  <line x1="1268" y1="900" x2="1412" y2="900" class="message"/><text x="1340" y="885" class="msg">Route response</text>
  <circle cx="1420" cy="935" r="13" fill="#0052cc"/><text x="1420" y="939" class="step">13</text>
  <line x1="1433" y1="935" x2="1577" y2="935" class="message"/><text x="1505" y="920" class="msg">Deliver response message</text>
  <circle cx="1585" cy="980" r="13" fill="#0052cc"/><text x="1585" y="984" class="step">14</text>
  <line x1="1598" y1="980" x2="1742" y2="980" class="message"/><text x="1670" y="965" class="msg">Read delivery configuration</text>
  <line x1="1742" y1="1005" x2="1593" y2="1005" class="response"/><text x="1668" y="1022" class="msg">Endpoint · format · secretId</text>
  <circle cx="1585" cy="1045" r="13" fill="#0052cc"/><text x="1585" y="1049" class="step">15</text>
  <line x1="1598" y1="1045" x2="1907" y2="1045" class="message"/><text x="1752" y="1030" class="msg">Retrieve credentials (if required)</text>
  <line x1="1907" y1="1070" x2="1593" y2="1070" class="response"/><text x="1750" y="1087" class="msg">Credentials</text>
  <circle cx="1585" cy="1110" r="13" fill="#0052cc"/><text x="1585" y="1114" class="step">16</text>
  <line x1="1598" y1="1110" x2="2072" y2="1110" class="message"/><text x="1835" y="1095" class="msg">HTTPS Callback</text>
  <circle cx="2080" cy="1145" r="13" fill="#6b778c"/><text x="2080" y="1149" class="step">17</text>
  <line x1="2072" y1="1145" x2="1593" y2="1145" class="response"/><text x="1833" y="1132" class="msg">HTTP Response</text>
  <circle cx="1585" cy="1185" r="13" fill="#0052cc"/><text x="1585" y="1189" class="step">18</text>
  <line x1="1577" y1="1185" x2="603" y2="1185" class="message"/><text x="1090" y="1170" class="msg">Update deliveryStatus · deliveryAttemptCount · HTTP status · delivery timestamp</text>

  <!-- Analytics parallel note -->
  <rect x="2230" y="210" width="300" height="1015" rx="14" fill="#f7f9fc" stroke="#0052cc" stroke-width="1.5"/>
  <rect x="2230" y="210" width="300" height="42" rx="14" fill="#b3d4ff"/><text x="2380" y="237" class="pname" font-size="14">PARALLEL ANALYTICS COPY</text>
  <text x="2380" y="285" class="noteText">Alongside EventBridge</text>
  <g transform="translate(2310 320)"><rect class="participant" width="140" height="65"/><text x="70" y="39" class="pname">Analytics Rule</text></g>
  <path d="M2380 385V430" class="message"/>
  <g transform="translate(2310 430)"><rect class="participant" width="140" height="65"/><text x="70" y="39" class="pname">Firehose</text></g>
  <path d="M2380 495V540" class="message"/>
  <g transform="translate(2310 540)"><rect class="participant" width="140" height="65"/><text x="70" y="39" class="pname">Amazon S3</text></g>
  <path d="M2380 605V650" class="message"/>
  <g transform="translate(2310 650)"><rect class="participant" width="140" height="65"/><text x="70" y="39" class="pname">AWS Glue</text></g>
  <path d="M2380 715V760" class="message"/>
  <g transform="translate(2310 760)"><rect class="participant" width="140" height="65"/><text x="70" y="39" class="pname">Amazon Athena</text></g>
  <path d="M2380 825V870" class="message"/>
  <g transform="translate(2310 870)"><rect class="participant" width="140" height="65"/><text x="70" y="39" class="pname">QuickSight</text></g>
  <rect x="2270" y="990" width="220" height="90" class="note"/><text x="2380" y="1025" class="noteText">Runs independently of</text><text x="2380" y="1045" class="noteText">transactional processing</text>
  <path d="M830 470H2200V352H2310" class="response"/>

  <!-- Bottom characteristics -->
  <rect x="30" y="1270" width="2500" height="125" rx="14" fill="#232f3e"/>
  <text x="60" y="1304" font-size="15" font-weight="700" class="benefitHead">SEQUENCE CHARACTERISTICS</text>
  <text x="60" y="1340" font-size="12" class="benefit">• Asynchronous request processing</text><text x="60" y="1370" font-size="12" class="benefit">• HTTP 202 returned before business processing</text>
  <text x="460" y="1340" font-size="12" class="benefit">• Durable lifecycle tracking</text><text x="460" y="1370" font-size="12" class="benefit">• Canonical event model</text>
  <text x="820" y="1340" font-size="12" class="benefit">• Independent processing and delivery status</text><text x="820" y="1370" font-size="12" class="benefit">• Event-driven communication</text>
  <text x="1320" y="1340" font-size="12" class="benefit">• Partner callback after processing completes</text><text x="1320" y="1370" font-size="12" class="benefit">• Analytics remains independent</text>
  <text x="2525" y="1425" text-anchor="end" font-size="10" fill="#7a869a">UML sequence diagram • runtime interaction view</text>
</svg>
